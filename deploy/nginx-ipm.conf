# Nginx site for the IPM dashboard. One origin for the UI and the API — that is
# what lets the session cookie be SameSite=Lax with no CORS anywhere.
#
#   sudo cp deploy/nginx-ipm.conf /etc/nginx/sites-available/ipm
#   sudo ln -sf /etc/nginx/sites-available/ipm /etc/nginx/sites-enabled/ipm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Once a domain points here:
#   sudo certbot --nginx -d ipm.example.com
# then drop COOKIE_SECURE=false from backend/.env and restart.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # replace with the hostname once DNS exists

    # Lab report PDFs are the largest thing that moves through here.
    client_max_body_size 25M;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # ── API and uploads go straight to Express.
    # Next also rewrites /api in development; in production nginx gets there
    # first, which is one hop fewer and keeps the two environments equivalent.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OpenAI extraction on a large report can take a while.
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Everything else is the Next.js app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
